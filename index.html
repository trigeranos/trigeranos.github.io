<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TriGeranos</title>
<meta name="description" content="TriGeranos(トリゲラノス) - スマートフォン向けゲームアプリの開発">
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #161a21;
    --fg: #f2f3f5;
    --fg-soft: #a9afbb;
    --accent: #6ee7b7;
    --border: #262b34;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.7;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 36px;
  }

  .logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--fg);
  }

  .logo span {
    color: var(--accent);
  }

  .tagline {
    margin-top: 6px;
    color: var(--fg-soft);
    font-size: 14px;
  }

  .section {
    margin-top: 32px;
  }

  .section h2 {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-soft);
    margin-bottom: 8px;
  }

  .section p {
    font-size: 16px;
    color: var(--fg);
  }

  .section a {
    color: var(--accent);
    text-decoration: none;
  }

  .section a:hover {
    text-decoration: underline;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 32px 0;
  }

  footer {
    color: var(--fg-soft);
    font-size: 13px;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fa;
      --bg-soft: #ffffff;
      --fg: #1a1d23;
      --fg-soft: #666d7a;
      --accent: #0f9d6e;
      --border: #e3e6eb;
    }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">Tri<span>Geranos</span></div>
    <div class="tagline">トリゲラノス</div>

    <div class="section">
      <h2>事業内容</h2>
      <p>スマートフォン向けゲームアプリの企画・開発・運営</p>
    </div>

    <div class="section">
      <h2>お問い合わせ</h2>
      <p><a href="mailto:trigeranos@gmail.com">trigeranos@gmail.com</a></p>
    </div>

    <div class="divider"></div>

    <footer>&copy; 2026 TriGeranos</footer>
  </main>
</body>
</html>
