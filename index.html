<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TriGeranos</title>
<meta name="description" content="TriGeranos(トリゲラノス) - スマートフォン向けゲームアプリの開発">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #ffffff;
    --fg: #161616;
    --fg-soft: #666666;
    --accent: #c8102e;
    --accent-yellow: #f2b705;
    --border: #1a1a1a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --bg-soft: #1a1a1a;
      --fg: #f5f5f5;
      --fg-soft: #aaaaaa;
      --accent: #ff4d5e;
      --accent-yellow: #ffd54f;
      --border: #333333;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.7;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--bg-soft);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 48px 36px;
  }

  .stripe {
    display: flex;
    height: 4px;
    width: 64px;
    margin-top: 14px;
    border-radius: 2px;
    overflow: hidden;
  }

  .stripe span {
    flex: 1;
  }

  .stripe span:nth-child(1) { background: var(--fg); }
  .stripe span:nth-child(2) { background: var(--accent); }
  .stripe span:nth-child(3) { background: var(--accent-yellow); }

  .logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--fg);
  }

  .logo span {
    color: var(--accent);
  }

  .tagline {
    margin-top: 6px;
    color: var(--fg-soft);
    font-size: 14px;
  }

  .section {
    margin-top: 32px;
  }

  .section h2 {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-soft);
    margin-bottom: 8px;
  }

  .section p {
    font-size: 16px;
    color: var(--fg);
  }

  .section a {
    color: var(--accent);
    text-decoration: none;
  }

  .section a:hover {
    text-decoration: underline;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 32px 0;
  }

  footer {
    color: var(--fg-soft);
    font-size: 13px;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">Tri<span>Geranos</span></div>
    <div class="tagline">トリゲラノス</div>
    <div class="stripe"><span></span><span></span><span></span></div>

    <div class="section">
      <h2>事業内容</h2>
      <p>スマートフォン向けゲームアプリの企画・開発・運営</p>
    </div>

    <div class="section">
      <h2>お問い合わせ</h2>
      <p><a href="mailto:trigeranos@gmail.com">trigeranos@gmail.com</a></p>
    </div>

    <div class="section">
      <h2>デモ</h2>
      <p><a href="game.html">🎮 ダンボール迷宮をプレイする</a></p>
    </div>

    <div class="divider"></div>

    <footer>&copy; 2026 TriGeranos</footer>
  </main>
</body>
</html>
