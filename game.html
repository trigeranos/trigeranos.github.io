<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>いっしゅん よみ</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #2b2b2b;
    --sub: #777;
    --accent: #3a6ea5;
    --hard: #b5532e;
    --ok: #2e9e5b;
    --ng: #d64545;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #app {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 6px 24px rgba(0,0,0,.08);
    padding: 24px 20px 28px;
    text-align: center;
    min-height: 440px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  section { display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 0; font-size: 1.8rem; letter-spacing: .1em; }
  .desc { color: var(--sub); line-height: 1.8; font-size: .95rem; margin: 0; }
  .status {
    display: flex; justify-content: space-between;
    color: var(--sub); font-size: .9rem;
  }
  .sentence {
    font-size: clamp(1.4rem, 6vw, 2rem);
    line-height: 1.8;
    min-height: 7.2rem;
    display: flex; align-items: center; justify-content: center;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  /* むずかしいモードの長文 */
  .sentence.long {
    font-size: clamp(1.05rem, 4.4vw, 1.35rem);
    line-height: 2;
    text-align: left;
    justify-content: flex-start;
    min-height: 10rem;
  }
  .question {
    font-size: clamp(1.3rem, 5.5vw, 1.8rem);
    min-height: 4rem;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }
  .bar { height: 8px; background: #e6e2d8; border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 100%; background: var(--accent); }
  .hard-mode .bar > div { background: var(--hard); }
  .choices { display: flex; flex-direction: column; gap: 12px; }
  .modes { display: flex; gap: 12px; }
  .modes button { flex: 1; }
  button {
    font: inherit;
    font-size: 1.2rem;
    padding: 16px 12px;
    border: 2px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(.98); }
  button.primary { background: var(--accent); color: #fff; }
  button.hard { background: var(--hard); border-color: var(--hard); color: #fff; }
  button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.ng { background: var(--ng); border-color: var(--ng); color: #fff; }
  button.plain { border-color: #ccc; color: var(--sub); font-size: 1rem; padding: 12px; }
  .big { font-size: 3rem; font-weight: bold; color: var(--accent); margin: 0; }
  .small { color: var(--sub); font-size: .95rem; margin: 0; }
  .recall { background: #f7f5ef; border-radius: 12px; padding: 12px; line-height: 1.9; text-align: left; word-break: keep-all; overflow-wrap: anywhere; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">

  <!-- スタート画面 -->
  <section id="screen-start">
    <h1>いっしゅん よみ</h1>
    <p class="desc">
      みじかい ぶんが いっしゅん だけ でます。<br>
      きえたあとの もんだいに こたえよう。<br>
      まちがえたら おしまい。れんぞく せいかいを きそおう。
    </p>
    <div class="modes">
      <button class="primary" id="btn-normal">ふつう</button>
      <button class="hard" id="btn-hard">むずかしい</button>
    </div>
    <p class="small" id="best-start"></p>
  </section>

  <!-- 表示フェーズ -->
  <section id="screen-show" class="hidden">
    <div class="status"><span id="show-streak"></span><span id="show-time"></span></div>
    <div class="sentence" id="sentence"></div>
    <div class="bar"><div id="bar-fill"></div></div>
  </section>

  <!-- 出題フェーズ -->
  <section id="screen-ask" class="hidden">
    <div class="status"><span id="ask-streak"></span><span id="ask-mode"></span></div>
    <div class="question" id="question"></div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- 結果画面 -->
  <section id="screen-over" class="hidden">
    <p class="small" id="over-mode"></p>
    <p class="big" id="over-score"></p>
    <p class="small" id="over-best"></p>
    <div class="recall" id="over-recall"></div>
    <button class="primary" id="btn-retry">もういちど</button>
    <button class="plain" id="btn-back">モードを えらぶ</button>
  </section>

</div>

<script>

      text: "ことしの えとの どうぶつを いつも わすれてしまうので、けいたいの まちうけがめんを そのどうぶつにした。",
      questions: [
        { q: "いつも わすれる ものは?", a: "ことしの えとの どうぶつ", wrong: ["ともだちの たんじょうび", "でんわばんごう"] },
        { q: "かえた ものは?",          a: "まちうけがめん",           wrong: ["ちゃくしんおん", "けいたいの けーす"] },
        { q: "なぜ かえた?",            a: "わすれてしまうから",       wrong: ["かわいいから", "ともだちに すすめられたから"] },
      ],
    },
  ];

  // まちがいの選択肢の「予備の言葉」。type ごとに足していけます。
  const WORDS = {
    "てんき":     ["あめ", "はれ", "くもり", "ゆき", "かぜ", "かみなり"],
    "たべもの":   ["ぱん", "ごはん", "らーめん", "うどん", "さかな", "たまご", "かれー", "りんご", "みかん", "いちご", "ばなな"],
    "どうぶつ":   ["いぬ", "ねこ", "うさぎ", "とり", "さる", "くま", "かめ"],
    "ばしょ":     ["がっこう", "えき", "こうえん", "うみ", "やま", "みせ", "びょういん", "としょかん", "ほんや"],
    "のみもの":   ["みず", "おちゃ", "ぎゅうにゅう", "こうちゃ", "じゅーす", "こーひー"],
    "もの":       ["かさ", "ながぐつ", "こーと", "てぶくろ", "ぼうし", "まふらー"],
    "ひと":       ["おかあさん", "おとうさん", "ともだち", "おばあちゃん", "いもうと", "たろう", "はなこ", "けんた", "ゆい"],
    "こうどう":   ["あそんだ", "さんぽした", "はしった", "えを かいた", "ぼーるを なげた"],
    "りゆう":     ["あめが ふったから", "ゆきが ふったから", "かぜが つよかったから", "はれていたから", "ねぼうしたから", "はやく おきたから"],
    "じゅぎょう": ["さんすう", "こくご", "おんがく", "たいいく", "りか", "ずこう"],
    "あそび":     ["さっかー", "おにごっこ", "かくれんぼ", "なわとび", "どっじぼーる"],
    "いきかた":   ["あるいて", "はしって", "ばすで", "じてんしゃで"],
  };

  // ===== 表示時間(仮の値。遊びながら調整) =====
  //  表示時間 = 文字数 × PER_CHAR × SHRINK^(連続正解数)  ただし 文字数 × MIN_PER_CHAR より短くしない
  const NORMAL = { PER_CHAR: 140, SHRINK: 0.93, MIN_PER_CHAR: 30 };
  const HARD   = { PER_CHAR: 115, SHRINK: 0.95, MIN_PER_CHAR: 45 };

  // =====================================================================
  //  ここから下はゲームの仕組み
  // =====================================================================
  const $ = (id) => document.getElementById(id);
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  const MODES = {
    normal: { name: "ふつう",     stories: NORMAL_STORIES, timing: NORMAL, key: "ippun-yomi-best" },
    hard:   { name: "むずかしい", stories: HARD_STORIES,   timing: HARD,   key: "ippun-yomi-best-hard" },
  };

  // type ごとの候補 = WORDS + 全文章の答え
  const POOL = {};
  const addPool = (type, w) => {
    if (!POOL[type]) POOL[type] = [];
    if (!POOL[type].includes(w)) POOL[type].push(w);
  };
  Object.keys(WORDS).forEach((t) => WORDS[t].forEach((w) => addPool(t, w)));
  [...NORMAL_STORIES, ...HARD_STORIES].forEach((s) =>
    s.questions.forEach((q) => { if (q.type) addPool(q.type, q.a); }));

  function buildChoices(story, item) {
    const norm = (w) => String(w).replace(/[\s\u3000]+/g, " ").trim();
    const ans = norm(item.a);
    item.a = ans;
    const wrong = [];
    const add = (w) => { w = norm(w); if (w && w !== ans && !wrong.includes(w)) wrong.push(w); };
    (item.wrong || []).forEach(add);
    if (wrong.length < 2) {
      const cand = (POOL[item.type] || []).filter((w) => norm(w) !== ans);
      shuffle(cand.filter((w) => story.text.includes(w))).forEach(add);
      shuffle(cand.filter((w) => !story.text.includes(w))).forEach(add);
    }
    if (wrong.length < 2) {
      console.warn("まちがいの選択肢が足りません。wrong か type を確認してください:", item);
    }
    return shuffle([ans, ...wrong.slice(0, 2)]);
  }

  function makeRound(story, streak, timing) {
    const item = pick(story.questions);
    const len = story.text.replace(/\s/g, "").length;
    const time = Math.max(len * timing.MIN_PER_CHAR, len * timing.PER_CHAR * Math.pow(timing.SHRINK, streak));
    return {
      text: story.text,
      question: item.q,
      correct: item.a,
      choices: buildChoices(story, item),
      time: Math.round(time),
    };
  }

  // ベストスコア(保存できない環境でも動くように)
  const loadBest = (k) => { try { return Number(localStorage.getItem(k)) || 0; } catch (e) { return 0; } };
  const saveBest = (k, n) => { try { localStorage.setItem(k, String(n)); } catch (e) {} };

  // ===== 画面 =====
  const screens = ["start", "show", "ask", "over"];
  const showScreen = (name) => {
    screens.forEach((s) => $("screen-" + s).classList.toggle("hidden", s !== name));
  };

  // ===== ゲーム状態 =====
  let mode = "normal";
  let streak = 0;   // 連続正解数 = 次に出す文章の番号
  let current = null;
  let timer = null;
  let locked = true;

  function startRound() {
    const m = MODES[mode];
    if (streak >= m.stories.length) { finish(true); return; }
    current = makeRound(m.stories[streak], streak, m.timing);
    locked = true;

    $("show-streak").textContent = "れんぞく " + streak + " / " + m.stories.length;
    $("show-time").textContent = (current.time / 1000).toFixed(1) + " びょう";
    const s = $("sentence");
    s.textContent = current.text;
    s.classList.toggle("long", mode === "hard");

    const fill = $("bar-fill");
    fill.style.transition = "none";
    fill.style.width = "100%";
    showScreen("show");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fill.style.transition = "width " + current.time + "ms linear";
      fill.style.width = "0%";
    }));

    clearTimeout(timer);
    timer = setTimeout(showQuestion, current.time);
  }

  function showQuestion() {
    $("ask-streak").textContent = "れんぞく " + streak;
    $("ask-mode").textContent = MODES[mode].name;
    $("question").textContent = current.question;
    const box = $("choices");
    box.innerHTML = "";
    current.choices.forEach((word, i) => {
      const b = document.createElement("button");
      b.textContent = (i + 1) + ".  " + word;
      b.dataset.word = word;
      b.addEventListener("click", () => answer(word, b));
      box.appendChild(b);
    });
    showScreen("ask");
    locked = false;
  }

  function answer(word, btn) {
    if (locked) return;
    locked = true;
    if (word === current.correct) {
      btn.classList.add("ok");
      streak++;
      timer = setTimeout(startRound, 450);
    } else {
      btn.classList.add("ng");
      [...$("choices").children].forEach((c) => {
        if (c.dataset.word === current.correct) c.classList.add("ok");
      });
      timer = setTimeout(() => finish(false), 900);
    }
  }

  function finish(cleared) {
    const m = MODES[mode];
    let best = loadBest(m.key);
    if (streak > best) { best = streak; saveBest(m.key, best); }
    $("over-mode").textContent = m.name + (cleared ? " ・ ぜんぶ クリア!" : " ・ れんぞく せいかい");
    $("over-score").textContent = streak;
    $("over-best").textContent = "ベスト " + best;

    const r = $("over-recall");
    r.innerHTML = "";
    r.classList.toggle("hidden", cleared);
    if (!cleared) {
      const t = document.createElement("div");
      t.textContent = current.text;
      const q = document.createElement("div");
      q.style.cssText = "margin-top:8px;color:#777";
      q.textContent = current.question + " → ";
      const a = document.createElement("b");
      a.style.color = "#2e9e5b";
      a.textContent = current.correct;
      q.appendChild(a);
      r.append(t, q);
    }
    showScreen("over");
  }

  function newGame(m) {
    mode = m;
    streak = 0;
    document.body.classList.toggle("hard-mode", mode === "hard");
    startRound();
  }

  function showStart() {
    const bn = loadBest(MODES.normal.key), bh = loadBest(MODES.hard.key);
    $("best-start").textContent = "ベスト  ふつう " + bn + "  /  むずかしい " + bh;
    showScreen("start");
  }

  // ===== 入力 =====
  $("btn-normal").addEventListener("click", () => newGame("normal"));
  $("btn-hard").addEventListener("click", () => newGame("hard"));
  $("btn-retry").addEventListener("click", () => newGame(mode));
  $("btn-back").addEventListener("click", showStart);
  document.addEventListener("keydown", (e) => {
    if (locked) return;
    const idx = ["1", "2", "3"].indexOf(e.key);
    if (idx >= 0) {
      const b = $("choices").children[idx];
      if (b) b.click();
    }
  });

  showStart();
})();
</script>
</body>
</html>
