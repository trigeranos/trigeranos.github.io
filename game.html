<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>いっしゅん よみ</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #2b2b2b;
    --sub: #777;
    --accent: #3a6ea5;
    --ok: #2e9e5b;
    --ng: #d64545;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #app {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 6px 24px rgba(0,0,0,.08);
    padding: 24px 20px 28px;
    text-align: center;
    min-height: 420px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
  }
  h1 { margin: 0; font-size: 1.8rem; letter-spacing: .1em; }
  .desc { color: var(--sub); line-height: 1.8; font-size: .95rem; margin: 0; }
  .status {
    display: flex; justify-content: space-between;
    color: var(--sub); font-size: .9rem;
  }
  .sentence {
    font-size: clamp(1.4rem, 6vw, 2rem);
    line-height: 1.8;
    min-height: 7.2rem;
    display: flex; align-items: center; justify-content: center;
    word-break: keep-all;
  }
  .question {
    font-size: clamp(1.4rem, 6vw, 2rem);
    min-height: 4rem;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }
  .bar { height: 8px; background: #e6e2d8; border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 100%; background: var(--accent); }
  .choices { display: flex; flex-direction: column; gap: 12px; }
  button {
    font: inherit;
    font-size: 1.3rem;
    padding: 16px;
    border: 2px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(.98); }
  button.primary { background: var(--accent); color: #fff; }
  button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.ng { background: var(--ng); border-color: var(--ng); color: #fff; }
  .big { font-size: 3rem; font-weight: bold; color: var(--accent); margin: 0; }
  .small { color: var(--sub); font-size: .95rem; margin: 0; }
  .recall { background: #f7f5ef; border-radius: 12px; padding: 12px; line-height: 1.8; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">

  <!-- スタート画面 -->
  <section id="screen-start">
    <h1>いっしゅん よみ</h1>
    <p class="desc" style="margin:16px 0 20px">
      みじかい ぶんが いっしゅん だけ でます。<br>
      きえたあとの もんだいに こたえよう。<br>
      まちがえたら おしまい。れんぞく せいかいを きそおう。
    </p>
    <p class="small" id="best-start" style="margin-bottom:16px"></p>
    <button class="primary" id="btn-start">スタート</button>
  </section>

  <!-- 表示フェーズ -->
  <section id="screen-show" class="hidden">
    <div class="status"><span id="show-streak"></span><span id="show-time"></span></div>
    <div class="sentence" id="sentence"></div>
    <div class="bar"><div id="bar-fill"></div></div>
  </section>

  <!-- 出題フェーズ -->
  <section id="screen-ask" class="hidden">
    <div class="status"><span id="ask-streak"></span><span></span></div>
    <div class="question" id="question"></div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- 結果画面 -->
  <section id="screen-over" class="hidden">
    <p class="small">れんぞく せいかい</p>
    <p class="big" id="over-score"></p>
    <p class="small" id="over-best" style="margin-bottom:14px"></p>
    <div class="recall" id="over-recall"></div>
    <button class="primary" id="btn-retry" style="margin-top:18px; width:100%">もういちど</button>
  </section>

</div>

<script>
(() => {
  "use strict";

  // ===== 出題データ(ひらがな・分かち書き) =====
  // 文: lead + " " + 語 + tail
  const CATEGORIES = [
    {
      pool: ["あめ", "はれ", "くもり", "ゆき", "かぜ", "かみなり"],
      slots: [
        { lead: "きのうは",  tail: "でした。",   q: "きのうの てんきは?" },
        { lead: "きょうは",  tail: "です。",     q: "きょうの てんきは?" },
        { lead: "あしたは",  tail: "でしょう。", q: "あしたの てんきは?" },
      ],
    },
    {
      pool: ["ぱん", "ごはん", "らーめん", "うどん", "さかな", "たまご", "かれー", "やさい"],
      slots: [
        { lead: "あさは", tail: "を たべました。", q: "あさに たべたのは?" },
        { lead: "ひるは", tail: "を たべました。", q: "ひるに たべたのは?" },
        { lead: "よるは", tail: "を たべました。", q: "よるに たべたのは?" },
      ],
    },
    {
      pool: ["いぬ", "ねこ", "うさぎ", "とり", "さる", "くま", "さかな", "かめ"],
      slots: [
        { lead: "こうえんで", tail: "を みました。", q: "こうえんで みたのは?" },
        { lead: "うみで",     tail: "を みました。", q: "うみで みたのは?" },
        { lead: "もりで",     tail: "を みました。", q: "もりで みたのは?" },
      ],
    },
    {
      pool: ["がっこう", "えき", "こうえん", "うみ", "やま", "みせ", "びょういん", "としょかん"],
      slots: [
        { lead: "たろうは",   tail: "へ いきました。", q: "たろうが いったのは?" },
        { lead: "はなこは",   tail: "へ いきました。", q: "はなこが いったのは?" },
        { lead: "けんたは",   tail: "へ いきました。", q: "けんたが いったのは?" },
      ],
    },
    {
      pool: ["みず", "おちゃ", "ぎゅうにゅう", "こうちゃ", "じゅーす", "こーひー"],
      slots: [
        { lead: "あついひは", tail: "を のみました。", q: "あついひに のんだのは?" },
        { lead: "さむいひは", tail: "を のみました。", q: "さむいひに のんだのは?" },
        { lead: "ねるまえは", tail: "を のみました。", q: "ねるまえに のんだのは?" },
      ],
    },
  ];

  // ===== 難易度 =====
  const BASE_TIME = 3500;     // 2つの情報の最初の表示時間(ms)
  const SHRINK = 0.93;        // 正解ごとの倍率
  const MIN_TIME = 700;       // 2つの情報の下限(ms)
  const THREE_FACTS_FROM = 8; // この連続正解数から3つの情報になる

  // ===== ユーティリティ =====
  const $ = (id) => document.getElementById(id);
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const screens = ["start", "show", "ask", "over"];
  const showScreen = (name) => {
    screens.forEach((s) => $("screen-" + s).classList.toggle("hidden", s !== name));
  };

  // ベストスコア(保存できない環境でも動くように)
  const KEY = "ippun-yomi-best";
  const loadBest = () => { try { return Number(localStorage.getItem(KEY)) || 0; } catch (e) { return 0; } };
  const saveBest = (n) => { try { localStorage.setItem(KEY, String(n)); } catch (e) {} };

  // ===== ゲーム状態 =====
  let streak = 0;
  let best = loadBest();
  let current = null;       // 出題中の問題
  let timer = null;
  let locked = true;        // 回答の受付可否

  // ===== 問題の生成 =====
  function makeQuestion() {
    const n = streak >= THREE_FACTS_FROM ? 3 : 2;
    const cat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
    // 使う枠を順番を保って n 個
    const slots = shuffle(cat.slots).slice(0, n)
      .sort((a, b) => cat.slots.indexOf(a) - cat.slots.indexOf(b));
    // 語は重ならないように
    const vals = shuffle(cat.pool).slice(0, n);
    const parts = slots.map((s, i) => s.lead + " " + vals[i] + s.tail);

    const target = Math.floor(Math.random() * n);
    const correct = vals[target];

    // 紛らわしい選択肢: 文に出てきた他の語を優先し、足りなければ同じ分類の語
    const others = vals.filter((_, i) => i !== target);
    const rest = shuffle(cat.pool.filter((w) => !vals.includes(w)));
    const wrongs = shuffle(others).concat(rest).slice(0, 2);

    const time = Math.max(MIN_TIME, BASE_TIME * Math.pow(SHRINK, streak)) * (n / 2);

    return {
      sentence: parts.join("\n"),
      parts,
      question: slots[target].q,
      correct,
      choices: shuffle([correct, ...wrongs]),
      time: Math.round(time),
    };
  }

  // ===== 画面の流れ =====
  function startRound() {
    current = makeQuestion();
    locked = true;

    $("show-streak").textContent = "れんぞく " + streak;
    $("show-time").textContent = (current.time / 1000).toFixed(1) + " びょう";
    $("sentence").innerHTML = current.parts.map((p) => "<div>" + p + "</div>").join("");

    const fill = $("bar-fill");
    fill.style.transition = "none";
    fill.style.width = "100%";
    showScreen("show");
    // 次のフレームでバーを縮め始める
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fill.style.transition = "width " + current.time + "ms linear";
      fill.style.width = "0%";
    }));

    clearTimeout(timer);
    timer = setTimeout(showQuestion, current.time);
  }

  function showQuestion() {
    $("ask-streak").textContent = "れんぞく " + streak;
    $("question").textContent = current.question;
    const box = $("choices");
    box.innerHTML = "";
    current.choices.forEach((word, i) => {
      const b = document.createElement("button");
      b.textContent = (i + 1) + ".  " + word;
      b.dataset.word = word;
      b.addEventListener("click", () => answer(word, b));
      box.appendChild(b);
    });
    showScreen("ask");
    locked = false;
  }

  function answer(word, btn) {
    if (locked) return;
    locked = true;
    if (word === current.correct) {
      btn.classList.add("ok");
      streak++;
      timer = setTimeout(startRound, 450);
    } else {
      btn.classList.add("ng");
      // 正解も見せる
      [...$("choices").children].forEach((c) => {
        if (c.dataset.word === current.correct) c.classList.add("ok");
      });
      timer = setTimeout(gameOver, 900);
    }
  }

  function gameOver() {
    if (streak > best) { best = streak; saveBest(best); }
    $("over-score").textContent = streak;
    $("over-best").textContent = "ベスト " + best;
    $("over-recall").innerHTML =
      current.parts.map((p) => "<div>" + p + "</div>").join("") +
      "<div style='margin-top:8px;color:#777'>" + current.question +
      " → <b style='color:#2e9e5b'>" + current.correct + "</b></div>";
    showScreen("over");
  }

  function newGame() {
    streak = 0;
    startRound();
  }

  // ===== 入力 =====
  $("btn-start").addEventListener("click", newGame);
  $("btn-retry").addEventListener("click", newGame);
  document.addEventListener("keydown", (e) => {
    if (locked) return;
    const idx = ["1", "2", "3"].indexOf(e.key);
    if (idx >= 0) {
      const b = $("choices").children[idx];
      if (b) b.click();
    }
  });

  // 初期表示
  $("best-start").textContent = best ? "ベスト " + best : "";
  showScreen("start");
})();
</script>
</body>
</html>
